[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vin-decoder-backend"
version = "0.1.0"
description = "Technischer VIN-Decoder mit Multi-Source-Abgleich und Konfidenz (EU/TR-Fokus)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
etl = [
    # BSD-3-Clause, liefert die herstellerspezifischen VDS-Regeln
    "vininfo>=1.11",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["app", "app.api", "app.decoder", "app.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI nutzt Aufrufe in Default-Argumenten (Query/Path)
